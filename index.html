<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>VOID TREE — дерево пустоты</title>
<style>
:root{
  --violet:#a855f7;
  --violet2:#e3c8ff;
  --gold:#fbbf24;
  --gold2:#ffe9b0;
  --shape: polygon(9% 0%, 91% 0%, 100% 13%, 100% 78%, 50% 100%, 0% 78%, 0% 13%);
  --font: "Lucida Console","DejaVu Sans Mono","Courier New",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#030208;color:#efe1ff;font-family:var(--font);user-select:none;-webkit-user-select:none}

/* ================= SKY / WORLD ================= */
#sky{position:fixed;inset:0;z-index:0;overflow:hidden;background:#030208}
#sky .glow{position:absolute;left:-10%;right:-10%;top:12%;height:60%;
  background:radial-gradient(ellipse 60% 42% at 50% 62%, rgba(147,87,255,.55), rgba(88,40,190,.22) 45%, transparent 72%);
  filter:blur(30px)}
#sky .sea{position:absolute;left:-5%;right:-5%;top:36%;height:16%;
  background:
    linear-gradient(180deg, rgba(255,255,255,.55) 0 2px, rgba(196,140,255,.35) 2px 6px, rgba(90,40,180,.12) 14px, transparent 70%);
  filter:blur(6px);opacity:.85}
#sky .sea2{position:absolute;left:-5%;right:-5%;top:40%;height:10%;
  background:linear-gradient(180deg, rgba(150,90,255,.28), transparent 80%);filter:blur(14px)}
#sky .groundhaze{position:absolute;left:0;right:0;top:42%;bottom:0;
  background:linear-gradient(180deg, rgba(40,16,80,.55), #05030a 55%)}
#sky .blob{position:absolute;border-radius:50%;filter:blur(38px);mix-blend-mode:screen;opacity:.5}
#dust{position:fixed;inset:0;z-index:3;pointer-events:none}
#dust i{position:absolute;width:2px;height:2px;border-radius:50%;background:#e9d5ff;box-shadow:0 0 8px #a855f7;
  animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.05;transform:scale(.6)}50%{opacity:.85;transform:scale(1.4)}}

/* ================= TOP BAR ================= */
#topbar{position:fixed;left:0;right:0;top:0;height:116px;z-index:30;display:flex;align-items:flex-start;justify-content:space-between;
  padding:16px 20px;pointer-events:none}
#topbar > *{pointer-events:auto}
.ico{width:42px;height:42px;border-radius:10px;border:1px solid rgba(168,85,247,.35);background:rgba(18,8,32,.72);
  color:#d8b4fe;font-family:var(--font);font-size:18px;line-height:1;display:grid;place-items:center;cursor:pointer;
  transition:transform .12s, box-shadow .2s, border-color .2s;backdrop-filter:blur(4px)}
.ico:hover{transform:translateY(-1px);border-color:var(--violet);box-shadow:0 0 14px rgba(168,85,247,.6)}
.ico:active{transform:scale(.94)}
.tgroup{display:flex;gap:10px}

#pills{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center}
.pill{position:relative;width:min(740px,54vw);height:46px;display:flex;align-items:center;justify-content:center;gap:12px;
  border-radius:8px;overflow:hidden}
.pill .ico2{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:28px;height:28px;display:grid;place-items:center}
.pill .label{font-size:20px;letter-spacing:.14em}
.pill .amount{font-size:23px;font-weight:bold;letter-spacing:.08em;transition:transform .12s}
.pill .amount.pop{transform:scale(1.05)}
.pill .rate{position:absolute;right:14px;font-size:11px;letter-spacing:.06em;opacity:.9}

.pill.void{border:2px solid #7c3aed;background:linear-gradient(180deg,rgba(46,16,86,.96),rgba(12,4,26,.96));
  box-shadow:0 0 20px rgba(124,58,237,.75), inset 0 0 24px rgba(124,58,237,.35);color:#e9d5ff}
.pill.void .label{color:#efe1ff;text-shadow:0 0 10px rgba(216,180,254,.9)}
.pill.void .amount{color:#fff;text-shadow:0 0 12px #a855f7,0 0 26px #7c3aed}
.pill.void .rate{color:#c084fc}
.pill.void .ico2{color:#c084fc;filter:drop-shadow(0 0 7px #a855f7)}

.pill.light{border:2px solid #b98217;background:linear-gradient(180deg,rgba(74,50,6,.96),rgba(24,14,2,.96));
  box-shadow:0 0 20px rgba(245,158,11,.6), inset 0 0 24px rgba(180,120,10,.3);color:#ffe9b0;
  transition:opacity .4s, filter .4s}
.pill.light .label{color:#ffe9b0;text-shadow:0 0 10px rgba(255,208,110,.9)}
.pill.light .amount{color:#fff8e2;text-shadow:0 0 12px #fbbf24,0 0 26px #b45309}
.pill.light .rate{color:#fcd34d}
.pill.light .ico2{color:#fcd34d;filter:drop-shadow(0 0 7px #f59e0b)}
.pill.light.off{opacity:.45;filter:grayscale(.6)}
.pill.ever{display:none;border:2px solid #0ea5e9;background:linear-gradient(180deg,rgba(6,40,64,.96),rgba(2,10,18,.96));
  box-shadow:0 0 20px rgba(56,189,248,.6), inset 0 0 24px rgba(14,165,233,.3);color:#bae6fd}
.pill.ever.on{display:flex}
.pill.ever .label{color:#dff5ff;text-shadow:0 0 10px rgba(125,211,252,.95)}
.pill.ever .amount{color:#f0fbff;text-shadow:0 0 12px #38bdf8,0 0 26px #0ea5e9}
.pill.ever .ico2{color:#7dd3fc;filter:drop-shadow(0 0 7px #38bdf8)}

/* ================= SIDE PANEL ================= */
#panel{position:fixed;left:18px;top:126px;bottom:18px;width:312px;z-index:20;border-radius:14px;padding:14px;
  background:rgba(8,4,14,.6);border:1px solid rgba(168,85,247,.22);backdrop-filter:blur(7px);
  box-shadow:0 0 40px rgba(0,0,0,.7), inset 0 0 60px rgba(124,58,237,.07);display:flex;flex-direction:column;gap:10px;overflow:auto}
#panel h3{margin:0;font-size:10px;letter-spacing:.24em;color:#a78bfa;font-weight:normal;text-align:center}

#core{position:relative;width:132px;height:132px;margin:0 auto}
#core .ring{position:absolute;inset:0;border-radius:50%;animation:spin 7s linear infinite;
  background:conic-gradient(from 0deg,#22d3ee,#a855f7,#ec4899,#f0abfc,#22d3ee);filter:blur(7px);opacity:.55}
#core .ring2{position:absolute;inset:10px;border-radius:50%;border:2px solid rgba(233,213,255,.45);
  box-shadow:0 0 16px #a855f7 inset,0 0 22px rgba(168,85,247,.9);animation:spin 11s linear infinite reverse}
#core .ring3{position:absolute;inset:22px;border-radius:50%;border:1px dashed rgba(216,180,254,.3);animation:spin 16s linear infinite}
#core .disk{position:absolute;inset:27px;border-radius:50%;display:grid;place-items:center;color:#e9d5ff;
  background:radial-gradient(circle at 50% 42%,#3b0f6b,#0d0216 72%);
  box-shadow:0 0 30px rgba(168,85,247,.85), inset 0 0 22px rgba(0,0,0,.95);animation:corepulse 2.6s ease-in-out infinite}
#core .disk svg{width:44px;height:44px;filter:drop-shadow(0 0 8px #c084fc)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes corepulse{50%{box-shadow:0 0 44px rgba(216,180,254,1), inset 0 0 22px rgba(0,0,0,.95)}}

.stats{display:flex;flex-direction:column;gap:6px;font-size:11.5px}
.stat{display:flex;justify-content:space-between;gap:8px;padding:6px 9px;border-radius:7px;
  background:linear-gradient(90deg,rgba(124,58,237,.12),rgba(124,58,237,.02));border:1px solid rgba(168,85,247,.15)}
.stat span{color:#a78bfa;letter-spacing:.05em}
.stat b{color:#f0e6ff}
.stat.gold{background:linear-gradient(90deg,rgba(245,158,11,.14),rgba(245,158,11,.02));border-color:rgba(245,158,11,.2)}
.stat.gold span{color:#e0a83a}
.stat.gold b{color:#ffe9b0}
.stat.ever{display:none;background:linear-gradient(90deg,rgba(56,189,248,.16),rgba(56,189,248,.02));border-color:rgba(56,189,248,.25)}
.stat.ever.on{display:flex}
.stat.ever span{color:#7dd3fc}
.stat.ever b{color:#e0f7ff}

.goal{font-size:10.5px;color:#a78bfa;letter-spacing:.06em}
.goal .bar{height:6px;border-radius:4px;margin-top:5px;background:rgba(124,58,237,.16);overflow:hidden;border:1px solid rgba(168,85,247,.25)}
.goal .fill{height:100%;width:0%;background:linear-gradient(90deg,#7c3aed,#d8b4fe);box-shadow:0 0 10px #a855f7;transition:width .25s}
.hint{font-size:10px;line-height:1.55;color:#6f6190;text-align:center;letter-spacing:.03em;margin-top:auto}

/* ================= STAGE / DIORAMA ================= */
#stage{position:fixed;inset:0;z-index:10;overflow:hidden;touch-action:none;cursor:grab}
#stage.dragging{cursor:grabbing}
#diorama{position:absolute;left:0;top:0;width:1600px;height:1100px;transform-origin:0 0;will-change:transform}
#floor{position:absolute;left:-200px;top:250px;width:2000px;height:900px;
  background:
    radial-gradient(ellipse 52% 42% at 50% 46%, rgba(124,58,237,.28), rgba(90,40,180,.07) 55%, transparent 78%),
    radial-gradient(ellipse 26% 18% at 50% 20%, rgba(168,85,247,.20), transparent 70%);
  filter:blur(2px)}
#platform{position:absolute;left:50%;top:620px;width:2200px;height:2600px;margin-left:-1100px;margin-top:-1300px;
  transform:rotateX(74deg);border-radius:50%;
  background:radial-gradient(ellipse at 50% 50%, rgba(22,11,42,.9) 0%, rgba(13,6,24,.85) 55%, rgba(8,4,16,.5) 80%, transparent 90%);
  border:2px solid rgba(150,100,240,.42);
  box-shadow:0 0 60px rgba(124,58,237,.45), inset 0 0 160px rgba(124,58,237,.3)}
#platform::after{content:'';position:absolute;inset:40px;border-radius:50%;border:1px dashed rgba(168,85,247,.18)}
#links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.link{fill:none;stroke-linecap:round;stroke-linejoin:round}
.link.glow{stroke:rgba(124,58,237,.20);stroke-width:12;filter:blur(7px)}
.link.core{stroke:rgba(124,58,237,.5);stroke-width:3}
.link.gold.core{stroke:rgba(180,120,10,.5)}
.link.gold.glow{stroke:rgba(245,158,11,.16)}
.link.near.core{stroke:rgba(200,150,255,.95);stroke-width:3.6;filter:drop-shadow(0 0 7px #a855f7)}
.link.near.glow{stroke:rgba(168,85,247,.45)}
.link.gold.near.core{stroke:rgba(252,211,77,.95);filter:drop-shadow(0 0 7px #f59e0b)}
.link.gold.near.glow{stroke:rgba(245,158,11,.4)}
.link.lit.core{stroke:#f2e6ff;stroke-width:3.8;filter:drop-shadow(0 0 6px #d8b4fe) drop-shadow(0 0 16px #a855f7)}
.link.lit.glow{stroke:rgba(216,180,254,.55);stroke-width:14}
.link.gold.lit.core{stroke:#fff3d2;filter:drop-shadow(0 0 6px #fcd34d) drop-shadow(0 0 16px #f59e0b)}
.link.gold.lit.glow{stroke:rgba(253,224,140,.5)}
.link.ever.core{stroke:rgba(14,165,233,.55)}
.link.ever.glow{stroke:rgba(56,189,248,.16)}
.link.ever.near.core{stroke:rgba(125,211,252,.98);filter:drop-shadow(0 0 7px #38bdf8)}
.link.ever.near.glow{stroke:rgba(56,189,248,.45)}
.link.ever.lit.core{stroke:#ecfeff;filter:drop-shadow(0 0 6px #7dd3fc) drop-shadow(0 0 16px #0ea5e9)}
.link.ever.lit.glow{stroke:rgba(125,211,252,.55)}

/* --------- node --------- */
.node{position:absolute;left:0;top:0;transform-origin:0 0;cursor:pointer}
.node .plaque{position:absolute;left:0;top:0;width:300px;height:300px;margin:-150px 0 0 -150px;
  transform:rotateX(72deg);border-radius:50%;
  background:radial-gradient(ellipse at 50% 50%, rgba(196,140,255,.85), rgba(150,90,255,.35) 42%, rgba(124,58,237,.10) 62%, transparent 74%);
  box-shadow:0 0 34px rgba(168,85,247,.6);opacity:.5;transition:opacity .25s}
.node.gold .plaque{background:radial-gradient(ellipse at 50% 50%, rgba(251,191,36,.32), rgba(180,120,10,.08) 55%, transparent 72%);
  box-shadow:0 0 26px rgba(245,158,11,.4)}
.node .panel{position:absolute;left:-125px;top:-290px;width:250px;height:150px;transition:transform .16s ease, filter .2s}
.node .stem{position:absolute;left:-1px;top:-140px;width:2px;height:140px;
  background:linear-gradient(180deg,rgba(226,200,255,.45),rgba(226,200,255,.95));
  box-shadow:0 0 10px rgba(168,85,247,.9);opacity:.9}
.node.gold .stem{background:linear-gradient(180deg,rgba(255,235,180,.9),rgba(245,158,11,.05));box-shadow:0 0 10px rgba(245,158,11,.8)}
.node.locked .stem{opacity:.22;box-shadow:none}
.node .frame{position:absolute;inset:0;clip-path:var(--shape);
  background:linear-gradient(180deg,#f2e2ff,#b06bf5 30%,#7c3aed 70%,#4c1d95);
  filter:drop-shadow(0 0 5px rgba(196,140,255,.95)) drop-shadow(0 0 18px rgba(150,70,240,.65))}
.node .inner{position:absolute;inset:2.4px;clip-path:var(--shape);padding:10px 14px 24px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;
  background:linear-gradient(180deg,rgba(24,9,44,.96),rgba(7,3,14,.97))}
.node .idx{position:absolute;left:13px;top:8px;font-size:8px;color:#8b7bb0;letter-spacing:.1em}
.node .title{font-size:13px;letter-spacing:.12em;color:#efe1ff;border-bottom:1px solid rgba(216,180,254,.5);
  padding-bottom:2px;text-shadow:0 0 9px rgba(168,85,247,.85);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .desc{font-size:10px;line-height:1.35;color:#c4b5fd;letter-spacing:.04em}
.node .foot{position:absolute;bottom:16px;left:0;right:0;font-size:11px;letter-spacing:.08em;color:#d8b4fe}

.node.gold .frame{background:linear-gradient(180deg,#fffefb,#ffeeb0 26%,#fbc02d 62%,#d97706)}
.node.gold .frame{filter:drop-shadow(0 0 6px rgba(253,211,110,.95)) drop-shadow(0 0 20px rgba(217,119,6,.7))}
.node.gold .title{color:#fff6dd;border-bottom-color:rgba(253,211,110,.55);text-shadow:0 0 9px rgba(251,191,36,.9)}
.node.gold .desc{color:#fadf9d}
.node.gold .foot{color:#fde68a}
.node.gold .inner{background:linear-gradient(180deg,rgba(36,22,4,.96),rgba(14,8,2,.97))}

.node.ever .frame{background:linear-gradient(180deg,#f2fdff,#7dd3fc 26%,#38bdf8 62%,#0369a1);
  filter:drop-shadow(0 0 6px rgba(125,211,252,.95)) drop-shadow(0 0 20px rgba(14,165,233,.7))}
.node.ever .inner{background:linear-gradient(180deg,rgba(5,24,38,.96),rgba(2,8,14,.97))}
.node.ever .title{color:#e0f7ff;border-bottom-color:rgba(125,211,252,.55);text-shadow:0 0 9px rgba(56,189,248,.9)}
.node.ever .desc{color:#a5e4f7}
.node.ever .foot{color:#bae6fd}
.node.ever .stem{background:linear-gradient(180deg,rgba(200,240,255,.45),rgba(200,240,255,.95));box-shadow:0 0 10px rgba(56,189,248,.9)}
.node.ever .plaque{background:radial-gradient(ellipse at 50% 50%, rgba(125,211,252,.8), rgba(14,165,233,.32) 42%, rgba(56,189,248,.1) 62%, transparent 74%);
  box-shadow:0 0 34px rgba(56,189,248,.6)}
.node.ever.owned .frame{filter:drop-shadow(0 0 8px #e0f7ff) drop-shadow(0 0 26px rgba(14,165,233,.9))}
.node .lv{position:absolute;right:13px;top:8px;font-size:8px;letter-spacing:.08em;color:#9d8fbd}
.node.ever .lv{color:#7dd3fc}

.node.locked{cursor:default;opacity:.74}
.node.locked .frame{background:linear-gradient(180deg,#4a3a66,#2f2449 60%,#170f29);filter:drop-shadow(0 0 4px rgba(96,66,140,.4))}
.node.locked .title{color:#8b7bb0;border-bottom-color:rgba(139,123,176,.35);text-shadow:none}
.node.locked .desc,.node.locked .foot{color:#6f6389}
.node.locked .inner{background:linear-gradient(180deg,rgba(12,8,20,.95),rgba(4,2,8,.97))}
.node.locked .plaque{opacity:.18}

.node.owned .plaque{opacity:.95}
.node.owned .frame{filter:drop-shadow(0 0 7px rgba(226,200,255,1)) drop-shadow(0 0 24px rgba(168,85,247,.8))}
.node.gold.owned .frame{filter:drop-shadow(0 0 7px rgba(255,240,200,1)) drop-shadow(0 0 24px rgba(245,158,11,.85))}
.node.owned .title{color:#fff}
.node.owned .foot{color:#f5e9ff;text-shadow:0 0 9px #a855f7}
.node.owned{animation:ownflash .6s ease-out}
@keyframes ownflash{0%{filter:brightness(1.6)}100%{filter:brightness(1)}}

.node.ready:hover .panel{transform:translateY(-3px) scale(1.02)}
.node.can .frame{animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{
  0%,100%{filter:drop-shadow(0 0 5px rgba(216,180,254,.9)) drop-shadow(0 0 12px rgba(168,85,247,.55))}
  50%{filter:drop-shadow(0 0 11px rgba(255,255,255,.95)) drop-shadow(0 0 28px rgba(192,132,252,.95))}
}
.node.shake .panel{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* --------- BIG BANG --------- */
.node .hugering{position:absolute;left:0;top:0;width:680px;height:680px;margin:-340px 0 0 -340px;border-radius:50%;
  transform:rotateX(62deg);border:6px solid rgba(160,120,255,.55);
  box-shadow:0 0 70px rgba(124,58,237,.75), inset 0 0 70px rgba(124,58,237,.5);opacity:.55;transition:opacity .4s}
.node.big .panel{width:300px;left:-150px;top:-320px;height:180px}
.node.big .stem{top:-140px;height:140px}
.node.big .hugering{opacity:.95;border-color:rgba(200,170,255,.9);
  box-shadow:0 0 90px rgba(150,90,255,.95), inset 0 0 90px rgba(120,60,240,.7);animation:ringpulse 3s ease-in-out infinite}
@keyframes ringpulse{50%{box-shadow:0 0 140px rgba(190,150,255,1), inset 0 0 110px rgba(150,90,255,.9)}}
.node.big .title{font-size:16px;letter-spacing:.2em;color:#fff;text-shadow:0 0 16px #a855f7,0 0 34px #7c3aed}
.node.big.locked{opacity:.8}
.node.big .frame{background:linear-gradient(180deg,#ffffff,#c9a8ff 30%,#8b5cf6 70%,#5b21b6)}
.node .shard{position:absolute;left:0;top:0;background:linear-gradient(135deg,#c4b5fd,#4c1d95);
  box-shadow:0 0 16px rgba(150,90,255,.85);animation:shardfloat 4.5s ease-in-out infinite;pointer-events:none}
@keyframes shardfloat{50%{transform:rotate(45deg) translate(0,-22px) scale(1.1)}}

/* ================= FX / UI ================= */
#fx{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
.floaty{position:absolute;font-size:14px;font-weight:bold;color:#f5e9ff;text-shadow:0 0 10px #a855f7,0 0 20px #7c3aed;
  animation:floatup 1.2s ease-out forwards;white-space:nowrap}
.floaty.gold{color:#fff6dd;text-shadow:0 0 10px #f59e0b,0 0 22px #b45309}
.floaty.soft{font-size:10px;opacity:.7;font-weight:normal}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,0) scale(.7)}
  18%{opacity:1;transform:translate(-50%,-10px) scale(1)}
  100%{opacity:0;transform:translate(-50%,-56px) scale(1)}}
.ripple{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;
  border:2px solid rgba(216,180,254,.9);box-shadow:0 0 22px #a855f7;animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(5);opacity:0}}

#toasts{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:45;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:9px 18px;border-radius:8px;font-size:11.5px;letter-spacing:.12em;color:#f5e9ff;
  background:rgba(18,7,32,.94);border:1px solid rgba(168,85,247,.6);box-shadow:0 0 22px rgba(168,85,247,.55);
  animation:toastin .3s ease-out, toastout .4s ease-in 2.3s forwards}
.toast.gold{border-color:rgba(245,158,11,.7);box-shadow:0 0 22px rgba(245,158,11,.5);color:#ffe9b0}
@keyframes toastin{from{opacity:0;transform:translateY(14px)}}
@keyframes toastout{to{opacity:0;transform:translateY(-8px)}}

#logo{display:none}

/* --------- action bar --------- */
#actionbar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:26;display:flex;gap:22px;align-items:flex-start}
.abtn{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  border:2px solid rgba(168,85,247,.8);background:radial-gradient(circle at 50% 38%,rgba(58,24,108,.96),rgba(8,3,16,.96));
  color:#e9d5ff;font-family:var(--font);font-size:19px;line-height:1;
  box-shadow:0 0 20px rgba(124,58,237,.55);transition:transform .12s, box-shadow .2s}
.abtn:hover{transform:translateY(-2px)}
.abtn:active{transform:scale(.95)}
.abtn .cap{position:absolute;top:60px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.13em;color:#a78bfa;white-space:nowrap;pointer-events:none}
.abtn.static{cursor:default;box-shadow:0 0 24px rgba(168,85,247,.7)}
.abtn.static:hover{transform:none}
.abtn.bang{border-color:#2f9bd6;color:#bfe9ff;box-shadow:0 0 18px rgba(56,189,248,.45);opacity:.5}
.abtn.bang.on{opacity:1;box-shadow:0 0 28px rgba(56,189,248,.95),0 0 60px rgba(56,189,248,.45);animation:bangpulse 1.6s ease-in-out infinite}
.abtn.bang.on .cap{color:#7dd3fc}
@keyframes bangpulse{50%{box-shadow:0 0 40px rgba(125,211,252,1),0 0 80px rgba(56,189,248,.6)}}

<body>

<script>
/* ============================================================
   VOID TREE — idle на платформе пустоты.
   Void (фиолетовый) + Light (золотой) + BIG BANG (престиж).
   ============================================================ */
const $ = s => document.querySelector(s);

/* ---------------- дерево ---------------- */
/* gx — колонка в мировых координатах (600 = центр), row — глубина (0 = ближе к камере) */
const NODES = [
  /* 0 */
  {id:'aw', t:'ПРОБУЖДЕНИЕ', gx:600, row:0, cost:15, fx:{addV:2}, d:['+2 пустоты / сек']},
  /* 1 */
  {id:'cm', t:'ХОЛОДНЫЙ РАЗУМ', gx:230, row:1, cost:180, fx:{multV:1.6}, d:['×1.6 к пустоте'], req:['aw']},
  {id:'rs', t:'РЕЗОНАНС', gx:600, row:1, cost:60, fx:{addV:4}, d:['+4 пустоты / сек'], req:['aw']},
  {id:'rr', t:'РВАНЫЙ РИТМ', gx:970, row:1, cost:350, fx:{multV:1.6}, d:['×1.6 к пустоте'], req:['aw']},
  /* 2 */
  {id:'rz', t:'РЕЗОНАТОР', gx:230, row:2, cost:2500, fx:{multV:1.8}, d:['×1.8 к пустоте'], req:['cm']},
  {id:'gb', t:'ГУЛ БЕЗДНЫ', gx:600, row:2, cost:900, fx:{multV:2}, d:['×2 к пустоте'], req:['rs']},
  {id:'us', t:'УСКОРЕНИЕ', gx:970, row:2, cost:6000, fx:{multV:1.8}, d:['×1.8 к пустоте'], req:['rr']},
  /* 3 */
  {id:'L1', t:'ЛУЧ', gx:230, row:3, cost:2000, cur:'void', gold:true, fx:{addL:.5}, d:['+0.5 света / сек'], req:['rz']},
  {id:'rl', t:'РАЗЛОМ', gx:600, row:3, cost:18000, fx:{multV:2}, d:['×2 к пустоте'], req:['gb']},
  {id:'pg', t:'ПЕРЕГРЕВ', gx:970, row:3, cost:150000, fx:{multV:2.2}, d:['×2.2 к пустоте'], req:['us']},
  /* 4 */
  {id:'L2', t:'СВЕТОЧ', gx:230, row:4, cost:6, cur:'light', gold:true, fx:{multV:1.7}, d:['×1.7 к пустоте'], req:['L1']},
  {id:'it', t:'ИТЕРАЦИЯ', gx:600, row:4, cost:400000, fx:{multV:2.5}, d:['×2.5 к пустоте'], req:['rl']},
  {id:'ks', t:'КАСКАД', gx:970, row:4, cost:3e6, fx:{multV:3}, d:['×3 к пустоте'], req:['pg']},
  /* 5 */
  {id:'L3', t:'СИЯНИЕ', gx:230, row:5, cost:40, cur:'light', gold:true, fx:{multL:2.5}, d:['×2.5 к свету'], req:['L2']},
  {id:'sg', t:'СИНГУЛЯРНОСТЬ', gx:600, row:5, cost:1e7, fx:{multV:3}, d:['×3 к пустоте'], req:['it']},
  {id:'ts', t:'ТИШИНА', gx:970, row:5, cost:4e7, fx:{multV:3}, d:['×3 к пустоте'], req:['ks']},
  /* 6 */
  {id:'L4', t:'ОРЕОЛ', gx:230, row:6, cost:250, cur:'light', gold:true, fx:{multV:2.2}, d:['×2.2 к пустоте'], req:['L3']},
  {id:'ab', t:'АБСОЛЮТ', gx:600, row:6, cost:2e8, fx:{multV:5}, d:['×5 к пустоте'], req:['sg']},
  /* ВЕЧНОСТЬ — постоянная ветка (справа), видна после первого Big Bang */
  {id:'e1', t:'ВЕЧНОСТЬ', gx:1240, row:1, cost:1, cur:'ever', ever:true, lvMax:5, costMul:2, fx:{multV:1.6}, d:['×1.6 к пустоте','за уровень']},
  {id:'e2', t:'АВТО-ПУСТОТА', gx:1240, row:2, cost:2, cur:'ever', ever:true, lvMax:3, costMul:2.5, fx:{autoV:1}, d:['сама закупает','узлы пустоты'], req:['e1']},
  {id:'e3', t:'СИЯНИЕ ВЕЧНОСТИ', gx:1240, row:3, cost:2, cur:'ever', ever:true, lvMax:5, costMul:2, fx:{multL:1.6}, d:['×1.6 к свету','за уровень'], req:['e2']},
  {id:'e4', t:'АВТО-СВЕТ', gx:1240, row:4, cost:3, cur:'ever', ever:true, lvMax:3, costMul:2.5, fx:{autoL:1}, d:['сам закупает','узлы света'], req:['e3']},
  {id:'e5', t:'ПРОСТОР', gx:1240, row:5, cost:5, cur:'ever', ever:true, lvMax:5, costMul:2.2, fx:{multV:2, multL:2}, d:['×2 ко всему','за уровень'], req:['e4']},
  /* 7 — престиж */
  {id:'bb', t:'BIG BANG', gx:600, row:7.6, cost:0, big:true, d:['СЖЕЧЬ ДЕРЕВО','×2 ко всему навсегда'], req:['ab','ts','L4']}
];
const BYID = Object.fromEntries(NODES.map(n => [n.id, n]));
const REAL = NODES.filter(n => !n.big && !n.ever);

/* ---------------- состояние ---------------- */
const SAVE_KEY = 'voidtree.save.v3';
const S = { void:0, light:0, ever:0, total:0, lv:{}, collapse:0, ts:0, born:Date.now() };
let stats = { vps:1, lps:0, prestige:1 };
let muted = false, dragMoved = false, lightSeen = false;

const lvOf = id => S.lv[id] || 0;
const maxLv = n => n.lvMax || 1;
const has = id => lvOf(id) > 0;
const maxed = n => lvOf(n.id) >= maxLv(n);
const costOf = n => n.cost * Math.pow(n.costMul || 1.7, lvOf(n.id));
const balOf = n => n.cur === 'light' ? S.light : (n.cur === 'ever' ? S.ever : S.void);
const unlocked = n => (n.req || []).every(has);
const prestigeMul = () => Math.pow(2, S.collapse);

/* ---------------- формат чисел ---------------- */
const UNITS = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd'];
function fmt(n){
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n);
  if (n < 1000){
    if (n === 0) return '0';
    if (n < 10) return n.toFixed(2).replace(/\.?0+$/,'');
    return Math.floor(n).toString();
  }
  let i = 0;
  while (n >= 1000 && i < UNITS.length - 1){ n /= 1000; i++; }
  return n.toFixed(2).replace(/\.?0+$/,'') + UNITS[i];
}
function fmtTime(sec){
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  if (h) return h + ' ч ' + m + ' мин';
  if (m) return m + ' мин ' + s + ' с';
  return s + ' с';
}

/* ---------------- экономика ---------------- */
function calc(){
  let addV = 0, multV = 1, addL = 0, multL = 1;
  for (const n of NODES){
    const L = lvOf(n.id);
    if (!L || !n.fx) continue;
    if (n.fx.addV)  addV  += n.fx.addV * L;
    if (n.fx.multV) multV *= Math.pow(n.fx.multV, L);
    if (n.fx.addL)  addL  += n.fx.addL * L;
    if (n.fx.multL) multL *= Math.pow(n.fx.multL, L);
  }
  const p = prestigeMul();
  return { vps: (1 + addV) * multV * p, lps: addL * multL * p, prestige: p };
}

/* ---------------- звук ---------------- */
let actx = null;
function ac(){
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, type, vol, slideTo){
  if (muted) return;
  try {
    const a = ac(), o = a.createOscillator(), g = a.createGain();
    o.type = type || 'triangle';
    o.frequency.setValueAtTime(freq, a.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
    g.gain.setValueAtTime(.0001, a.currentTime);
    g.gain.linearRampToValueAtTime(vol || .05, a.currentTime + .008);
    g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur + .03);
  } catch(e){}
}

/* ---------------- фон: пыль + кляксы ---------------- */
(function makeDust(){
  const d = $('#dust');
  for (let i = 0; i < 46; i++){
    const s = document.createElement('i');
    s.style.left = (Math.random()*100).toFixed(2) + '%';
    s.style.top = (Math.random()*100).toFixed(2) + '%';
    s.style.animationDelay = (Math.random()*4).toFixed(2) + 's';
    s.style.opacity = .3;
    d.appendChild(s);
  }
  const sky = $('#sky');
  for (let i = 0; i < 6; i++){
    const b = document.createElement('div');
    b.className = 'blob';
    const sz = 220 + Math.random()*420;
    b.style.width = sz + 'px';
    b.style.height = sz * (.5 + Math.random()*.6) + 'px';
    b.style.left = (Math.random()*100) + '%';
    b.style.top = (20 + Math.random()*55) + '%';
    b.style.background = ['#7c3aed','#4338ca','#db2777','#a855f7','#2563eb'][i % 5];
    b.style.animation = 'drift ' + (26 + i*7) + 's ease-in-out infinite alternate';
    b.style.animationDelay = (-i*4) + 's';
    sky.appendChild(b);
  }
  const st = document.createElement('style');
  st.textContent = '@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,-40px) scale(1.25)}}';
  document.head.appendChild(st);
})();

/* ---------------- раскладка (псевдо-3D) ---------------- */
const DW = 1600, DH = 1100;
const HORIZON = 150, NEAR_Y = 1010, CX = DW / 2;
const rowY = t => NEAR_Y - 946 * Math.log(1 + 0.185 * t);
const rowS = t => 1 / (1 + 0.185 * t);
const nodePos = n => ({ x: CX + (n.gx - 600) * rowS(n.row), y: rowY(n.row), s: rowS(n.row) });

const world = $('#diorama'), linksSvg = $('#links'), nodesLayer = $('#nodes');
const elById = {}, linkEls = {};

function roundPoly(pts, r){
  let d = 'M ' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
  for (let i = 1; i < pts.length - 1; i++){
    const p0 = pts[i-1], p1 = pts[i], p2 = pts[i+1];
    const v1x = p1[0]-p0[0], v1y = p1[1]-p0[1];
    const v2x = p2[0]-p1[0], v2y = p2[1]-p1[1];
    const l1 = Math.hypot(v1x, v1y) || 1, l2 = Math.hypot(v2x, v2y) || 1;
    const rr = Math.min(r, l1/2, l2/2);
    d += ' L ' + (p1[0]-v1x/l1*rr).toFixed(1) + ' ' + (p1[1]-v1y/l1*rr).toFixed(1) +
         ' Q ' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) + ' ' +
         (p1[0]+v2x/l2*rr).toFixed(1) + ' ' + (p1[1]+v2y/l2*rr).toFixed(1);
  }
  const last = pts[pts.length-1];
  return d + ' L ' + last[0].toFixed(1) + ' ' + last[1].toFixed(1);
}
/* точка на земле на «глубине» t и координате gx (t — плавающий номер ряда) */
function ground(gx, t){ return [CX + (gx - 600) * rowS(t), rowY(t)]; }
function linkPath(a, b){
  const tA = a.row, tB = b.row;
  const mid = (tA + tB) / 2;
  const pts = [];
  const seg = (gx1, t1, gx2, t2) => {
    for (let i = 0; i <= 8; i++){
      const k = i / 8;
      pts.push(ground(gx1 + (gx2 - gx1) * k, t1 + (t2 - t1) * k));
    }
  };
  if (a.gx === b.gx){
    // вертикальная связь, но с изломом-«ступенькой»
    seg(a.gx, tA, a.gx, mid - .06);
    const w = Math.max(18, 90 * rowS(mid));
    seg(a.gx, mid - .06, a.gx + w, mid);
    seg(a.gx + w, mid, a.gx, mid + .06);
    seg(a.gx, mid + .06, b.gx, tB);
  } else {
    seg(a.gx, tA, a.gx, mid);
    seg(a.gx, mid, b.gx, mid);
    seg(b.gx, mid, b.gx, tB);
  }
  return roundPoly(pts, 14);
}
const SVGNS = 'http://www.w3.org/2000/svg';
function buildTree(){
  for (const n of NODES){
    for (const rid of (n.req || [])){
      const d = linkPath(BYID[rid], n);
      const glow = document.createElementNS(SVGNS, 'path');
      glow.setAttribute('d', d); glow.setAttribute('class', 'link glow' + (n.gold ? ' gold' : '') + (n.ever ? ' ever' : ''));
      const core = document.createElementNS(SVGNS, 'path');
      core.setAttribute('d', d); core.setAttribute('class', 'link core' + (n.gold ? ' gold' : '') + (n.ever ? ' ever' : ''));
      linksSvg.append(glow, core);
      (linkEls[n.id] = linkEls[n.id] || []).push(glow, core);
    }
  }
  NODES.forEach((n, i) => {
    const p = nodePos(n);
    const el = document.createElement('div');
    el.className = 'node locked' + (n.gold ? ' gold' : '') + (n.big ? ' big' : '') + (n.ever ? ' ever' : '');
    el.style.transform = 'translate(' + p.x.toFixed(1) + 'px,' + p.y.toFixed(1) + 'px) scale(' + p.s.toFixed(3) + ')';
    el.style.zIndex = String(100 - Math.round(n.row * 10));
    el.innerHTML =
      (n.big ? '<div class="hugering"></div>' : '') +
      '<div class="plaque"></div>' +
      '<div class="stem"></div>' +
      '<div class="panel"><div class="frame"><div class="inner">' +
        '<div class="idx">' + (n.big ? '∞' : String(i+1).padStart(2,'0')) + '</div>' +
        (maxLv(n) > 1 ? '<div class="lv"></div>' : '') +
        '<div class="title">' + n.t + '</div>' +
        '<div class="desc">' + n.d.join('<br>') + '</div>' +
        '<div class="foot"></div>' +
      '</div></div></div>';
    if (n.big){
      for (let k = 0; k < 14; k++){
        const a = Math.random() * 6.2832, r = 190 + Math.random() * 200;
        const sz = 10 + Math.random() * 26;
        const sh = document.createElement('div');
        sh.className = 'shard';
        sh.style.width = sz + 'px'; sh.style.height = sz + 'px';
        sh.style.transform = 'translate(' + (Math.cos(a)*r).toFixed(0) + 'px,' + (Math.sin(a)*r*0.42).toFixed(0) + 'px) rotate(45deg)';
        sh.style.animationDelay = (-Math.random()*4.5).toFixed(2) + 's';
        sh.style.animationDuration = (3.4 + Math.random()*3).toFixed(2) + 's';
        sh.style.opacity = (0.35 + Math.random()*0.5).toFixed(2);
        el.appendChild(sh);
      }
    }
    el.addEventListener('click', () => { if (!dragMoved) buy(n.id); });
    nodesLayer.appendChild(el);
    elById[n.id] = el;
  });
}
buildTree();

/* ---------------- отрисовка состояния ---------------- */
function updateNodes(){
  const everOn = S.collapse > 0 || S.ever > 0;
  for (const n of NODES){
    const el = elById[n.id];
    const L = lvOf(n.id), MX = maxLv(n);
    const own = L >= MX;                 /* полностью выкуплен */
    const unl = unlocked(n);
    const price = costOf(n);
    el.style.display = (n.ever && !everOn) ? 'none' : '';
    el.classList.toggle('owned', own);
    el.classList.toggle('locked', !own && !unl);
    el.classList.toggle('ready', !own && unl);
    el.classList.toggle('can', !own && unl && (n.big ? true : balOf(n) >= price));
    const lvEl = el.querySelector('.lv');
    if (lvEl) lvEl.textContent = L + '/' + MX;
    el.querySelector('.foot').textContent = n.big
      ? (own ? '∎' : 'ЗАЖЕЧЬ')
      : (!unl ? 'ЗАКРЫТО'
        : (own ? (MX > 1 ? 'МАКС' : 'КУПЛЕНО')
          : (n.cur === 'light' ? 'СВЕТ: ' : n.cur === 'ever' ? 'ВЕЧН: ' : 'ЦЕНА: ') + fmt(price)));
    for (const p of (linkEls[n.id] || [])){
      p.style.display = (n.ever && !everOn) ? 'none' : '';
      p.classList.toggle('lit', own);
      p.classList.toggle('near', !own && unl);
    }
  }
  const bb = BYID.bb, elb = elById.bb, unl = bb.unlocked();
  elb.classList.toggle('locked', !unl);
  elb.classList.toggle('ready', unl);
  elb.classList.toggle('can', unl);
}
BYID.bb.unlocked = () => REAL.every(x => maxed(x));

/* ---------------- HUD ---------------- */
const elVoid = $('#voidVal'), elLight = $('#lightVal'), elEver = $('#everVal'),
      elRateV = $('#rateVoid'), elRateL = $('#rateLight'),
      elSV = $('#sVoid'), elSL = $('#sLight'), elSE = $('#sEver'), elTotal = $('#sTotal'),
      elOwned = $('#sOwned'), elColl = $('#sColl'),
      elGoalTitle = $('#goalTitle'), elGoalFill = $('#goalFill');

let lastHud = 0, lastPop = 0, popFlip = false;
function updateHUD(){
  const tv = fmt(S.void);
  if (elVoid.textContent !== tv) elVoid.textContent = tv;
  elLight.textContent = fmt(S.light);
  elEver.textContent = fmt(S.ever);
  elRateV.textContent = '+' + fmt(stats.vps) + '/с';
  elRateL.textContent = '+' + fmt(stats.lps) + '/с';
  elSV.textContent = fmt(stats.vps);
  elSL.textContent = fmt(stats.lps);
  elSE.textContent = fmt(S.ever);
  elTotal.textContent = fmt(S.total);
  elOwned.textContent = REAL.filter(x => has(x.id)).length + '/' + REAL.length;
  elColl.textContent = '×' + fmt(stats.prestige);
  const everOn = S.collapse > 0 || S.ever > 0;
  $('#pillLight').classList.toggle('off', !lightSeen && S.light <= 0);
  $('#pillEver').classList.toggle('on', everOn);
  $('#statEver').classList.toggle('on', everOn);

  const next = NODES.find(n => !n.big && unlocked(n) && !maxed(n));
  if (next){
    const price = costOf(next);
    elGoalTitle.textContent = 'ЦЕЛЬ: ' + next.t + ' — ' + fmt(price) +
      (next.cur === 'light' ? ' свет' : next.cur === 'ever' ? ' вечность' : '');
    elGoalFill.style.width = Math.min(100, balOf(next) / price * 100).toFixed(1) + '%';
  } else {
    elGoalTitle.textContent = 'ВСЁ ОТКРЫТО — ЖМИ BIG BANG';
    elGoalFill.style.width = '100%';
  }
}

/* ---------------- fx ---------------- */
const fxLayer = $('#fx');
function floatText(x, y, text, cls){
  const d = document.createElement('div');
  d.className = 'floaty' + (cls ? ' ' + cls : '');
  d.textContent = text;
  d.style.left = x + 'px'; d.style.top = (y - 12) + 'px';
  fxLayer.appendChild(d);
  setTimeout(() => d.remove(), 1250);
}
function ripple(x, y){
  const d = document.createElement('div');
  d.className = 'ripple';
  d.style.left = x + 'px'; d.style.top = y + 'px';
  fxLayer.appendChild(d);
  setTimeout(() => d.remove(), 650);
}
function toast(text, gold){
  const t = document.createElement('div');
  t.className = 'toast' + (gold ? ' gold' : '');
  t.textContent = text;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 2800);
}
let ambientAcc = 0;
function ambientTick(dt){
  ambientAcc += dt;
  if (ambientAcc < 1.3) return;
  ambientAcc = 0;
  const r = $('#core').getBoundingClientRect();
  floatText(r.left + r.width/2 + (Math.random()*36-18), r.top + r.height*0.5,
    '+' + fmt(stats.vps), 'soft');
  if (stats.lps > 0 && Math.random() < .5){
    floatText(r.left + r.width/2 + (Math.random()*36-18), r.top + r.height*0.62,
      '+' + fmt(stats.lps) + '✦', 'soft gold');
  }
}

/* ---------------- авто-покупатели (ветка Вечности) ---------------- */
const autoAcc = { void: 0, light: 0 };
function autoBuyTick(dt){
  const pairs = [['void', 'e2'], ['light', 'e4']];
  for (let i = 0; i < pairs.length; i++){
    const cur = pairs[i][0], id = pairs[i][1];
    const L = lvOf(id);
    if (!L) continue;
    autoAcc[cur] += dt;
    const period = 3.6 - 1.0 * (L - 1);
    if (autoAcc[cur] < period) continue;
    autoAcc[cur] = 0;
    const bal = cur === 'void' ? S.void : S.light;
    const cands = NODES.filter(n => !n.big && !n.ever && (n.cur || 'void') === cur && unlocked(n) && !maxed(n) && costOf(n) <= bal);
    if (!cands.length) continue;
    cands.sort((a, b) => costOf(a) - costOf(b));
    buy(cands[0].id, true);
  }
}

/* ---------------- покупки ---------------- */
function buy(id, silent){
  const n = BYID[id];
  if (!n) return;
  if (n.big){
    if (!BYID.bb.unlocked()){ if (!silent) toast('СНАЧАЛА ОТКРОЙ ВСЁ ДЕРЕВО', true); return; }
    doCollapse();
    return;
  }
  if (!unlocked(n) || maxed(n)) return;
  const cur = n.cur || 'void';
  const price = costOf(n);
  if (S[cur] < price){
    if (!silent){
      elById[id].classList.add('shake');
      setTimeout(() => elById[id].classList.remove('shake'), 320);
      tone(120, .1, 'sawtooth', .03, 90);
    }
    return;
  }
  const before = NODES.filter(x => unlocked(x) && !maxed(x)).map(x => x.id);
  S[cur] -= price;
  S.lv[id] = lvOf(id) + 1;
  stats = calc();

  const el = elById[id];
  el.classList.remove('owned'); void el.offsetWidth; el.classList.add('owned');

  if (!silent){
    if (n.ever) { tone(880, .1, 'sine', .05); setTimeout(() => tone(1320, .2, 'sine', .045), 70); }
    else if (n.gold){ tone(740, .09, 'triangle', .05); setTimeout(() => tone(1100, .18, 'triangle', .045), 70); }
    else { tone(620, .09, 'triangle', .05); setTimeout(() => tone(930, .16, 'triangle', .045), 70); }
    const r = el.querySelector('.panel').getBoundingClientRect();
    ripple(r.left + r.width/2, r.top + r.height/2);
    const newly = NODES.filter(x => unlocked(x) && before.indexOf(x.id) < 0);
    for (const x of newly) toast('ОТКРЫТ УЗЕЛ: ' + x.t, x.gold || x.ever);
    if (id === 'L1' && !lightSeen){ lightSeen = true; toast('СВЕТ ОТКРЫТ — ВАЛЮТА LIGHT ✦', true); }
  }

  updateNodes(); updateHUD(); save();
}

function doCollapse(){
  if (!BYID.bb.unlocked()) return;
  const earn = 1 + Math.floor(S.collapse / 2);
  S.ever += earn;
  S.collapse++;
  for (const k in S.lv) if (!BYID[k] || !BYID[k].ever) delete S.lv[k];
  S.void = 0; S.light = 0;
  stats = calc();
  tone(220, .6, 'sine', .07, 1200);
  setTimeout(() => tone(1200, .5, 'sine', .05, 200), 220);
  toast('BIG BANG ×' + fmt(stats.prestige) + ' — +' + earn + ' ВЕЧНОСТИ', true);
  updateNodes(); updateHUD(); save();
}

/* ---------------- камера (пан/зум) ---------------- */
const stage = $('#stage');
const cam = { x: 0, y: 0, s: 1 };
function freeRect(){
  const panelW = window.innerWidth > 900 ? 340 : 0;
  return { l: panelW, t: 120, w: window.innerWidth - panelW, h: window.innerHeight - 120 };
}
function applyCam(){
  world.style.transform = 'translate(' + cam.x.toFixed(1) + 'px,' + cam.y.toFixed(1) + 'px) scale(' + cam.s.toFixed(3) + ')';
}
function fitView(){
  const f = freeRect();
  const s = Math.max(.34, Math.min(1.2, Math.min(f.w / 1560, f.h / 1030) * 1.02));
  cam.s = s;
  cam.x = f.l + f.w/2 - DW/2 * s;
  cam.y = f.t + f.h/2 - 518 * s - 18 * s;
  applyCam();
}
function centerOnNode(id, scale){
  const n = BYID[id]; if (!n) return;
  const p = nodePos(n);
  const f = freeRect();
  cam.s = scale || Math.max(.7, cam.s);
  cam.x = f.l + f.w/2 - p.x * cam.s;
  cam.y = f.t + f.h/2 - (p.y - 90) * cam.s;
  applyCam();
}
fitView();
window.addEventListener('resize', applyCam);

let drag = null;
stage.addEventListener('pointerdown', e => {
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false };
  dragMoved = false;
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) > 4){
    drag.moved = true; dragMoved = true;
    stage.classList.add('dragging');
  }
  if (drag.moved){
    cam.x = drag.cx + dx; cam.y = drag.cy + dy; applyCam();
  }
});
function endDrag(){
  if (!drag) return;
  stage.classList.remove('dragging');
  drag = null;
  setTimeout(() => { dragMoved = false; }, 0);
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

stage.addEventListener('wheel', e => {
  e.preventDefault();
  const k = e.deltaY < 0 ? 1.1 : 1/1.1;
  const ns = Math.max(.3, Math.min(2.6, cam.s * k));
  const ratio = ns / cam.s;
  cam.x = e.clientX - (e.clientX - cam.x) * ratio;
  cam.y = e.clientY - (e.clientY - cam.y) * ratio;
  cam.s = ns;
  applyCam();
}, { passive: false });

stage.addEventListener('dblclick', e => {
  e.preventDefault();
  if (e.target.closest && e.target.closest('.node')) return;
  fitView();
});
$('#btnFocus').addEventListener('click', () => {
  const next = NODES.find(n => !has(n.id) && !n.big && unlocked(n)) || NODES.find(n => !has(n.id) && !n.big);
  if (next) centerOnNode(next.id);
});

/* ---- BIG BANG / авто-сброс ---- */
let autoReset = false;
const elBang = $('#btnBang'), elAuto = $('#btnAuto');
elBang.addEventListener('click', () => {
  if (!BYID.bb.unlocked()){ toast('СНАЧАЛА ОТКРОЙ ВСЁ ДЕРЕВО'); return; }
  doCollapse();
});
elAuto.addEventListener('click', () => {
  autoReset = !autoReset;
  elAuto.classList.toggle('on', autoReset);
  tone(autoReset ? 880 : 440, .1, 'square', .035);
  toast(autoReset ? 'АВТО-СБРОС ВКЛ' : 'АВТО-СБРОС ВЫКЛ', true);
});

/* ---------------- модалки ---------------- */
const modal = $('#modal');
function openModal(title, html){
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = html;
  modal.classList.add('open');
}
function closeModal(){ modal.classList.remove('open'); }
$('#modalClose').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

$('#btnHelp').addEventListener('click', () => openModal('КАК ИГРАТЬ',
  '<p>Кликать не надо — <b>Void</b> и <b>Light</b> капают сами, ты только строишь дерево на платформе.</p>' +
  '<ul>' +
  '<li>Фиолетовые узлы покупаются за <b>Void</b> и дают доход.</li>' +
  '<li>Золотой узел <b>ЛУЧ</b> открывает вторую валюту — <b>Light ✦</b>; остальные золотые узлы стоят свет и множат пустоту.</li>' +
  '<li>Узел покупается, когда куплен его родитель и хватает валюты.</li>' +
  '<li>В глубине платформы — <b>BIG BANG</b>: когда всё дерево открыто, он сжигает его и даёт <b>×2 навсегда</b>.</li>' +
  '<li>За каждый Big Bang дают <b>Everlasting ⚡</b> (1, 1, 2, 2, 3...). Это третья, <b>синяя ветка</b> справа — она <b>не сгорает</b> и даёт уровни: × к доходу и <b>авто-покупатели</b> узлов.</li>' +
  '<li>Узлы с бейджем уровня (напр. 2/5) можно покупать многократно — каждый уровень дороже.</li>' +
  '<li>Доход капает и с закрытой вкладкой (до 12 ч).</li>' +
  '</ul>' +
  '<p>Панорама — тянуть мышью. Зум — колесо. Двойной клик — вернуть вид.<br>' +
  'Снизу: <b>BIG BANG</b> — престиж, <b>АВТО-СБРОС</b> — сам жмёт престиж, когда дерево собрано.</p>'));

$('#btnMenu').addEventListener('click', () => {
  const played = fmtTime((Date.now() - S.born) / 1000);
  openModal('СТАТИСТИКА',
    '<div class="row"><span>Void в секунду</span><b>' + fmt(stats.vps) + '</b></div>' +
    '<div class="row"><span>Light в секунду</span><b>' + fmt(stats.lps) + '</b></div>' +
    '<div class="row"><span>Всего Void</span><b>' + fmt(S.total) + '</b></div>' +
    '<div class="row"><span>Big Bang</span><b>' + S.collapse + ' (×' + fmt(stats.prestige) + ')</b></div>' +
    '<div class="row"><span>Вечность</span><b>' + fmt(S.ever) + '</b></div>' +
    '<div class="row"><span>Узлов</span><b>' + REAL.filter(x => has(x.id)).length + '/' + REAL.length + '</b></div>' +
    '<div class="row"><span>В игре</span><b>' + played + '</b></div>' +
    '<button class="btn" id="mSave">СОХРАНИТЬ СЕЙВ</button>' +
    '<button class="btn danger" id="mReset">СБРОСИТЬ ПРОГРЕСС</button>');
});
document.addEventListener('click', e => {
  if (e.target.id === 'mSave'){ save(); toast('СЕЙВ СОХРАНЁН'); }
  if (e.target.id === 'mReset'){
    if (confirm('Сбросить весь прогресс?')){ localStorage.removeItem(SAVE_KEY); location.reload(); }
  }
});

$('#btnSound').addEventListener('click', e => {
  muted = !muted;
  e.currentTarget.textContent = muted ? '×' : '♪';
  e.currentTarget.style.opacity = muted ? .45 : 1;
  if (!muted) tone(660, .08, 'triangle', .04);
});

/* ---------------- сейв ---------------- */
let saveAcc = 0;
function save(){
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: 4, void: S.void, light: S.light, ever: S.ever, total: S.total, lv: S.lv,
      collapse: S.collapse, ts: Date.now(), born: S.born, lightSeen: lightSeen, autoReset: autoReset
    }));
  } catch(e){}
}
function load(){
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!d) return;
    S.void = +d.void || 0;
    S.light = +d.light || 0;
    S.ever = +d.ever || 0;
    S.total = +d.total || 0;
    S.collapse = +d.collapse || 0;
    S.born = +d.born || Date.now();
    lightSeen = !!d.lightSeen;
    autoReset = !!d.autoReset;
    S.lv = {};
    if (d.lv && typeof d.lv === 'object'){
      for (const k in d.lv) if (BYID[k]) S.lv[k] = Math.max(0, Math.min(maxLv(BYID[k]), +d.lv[k] || 0));
    } else if (Array.isArray(d.owned)){            /* миграция со v3 */
      d.owned.filter(id => BYID[id]).forEach(id => { S.lv[id] = 1; });
    }
    if (d.ts){
      const away = Math.min(12*3600, Math.max(0, (Date.now() - d.ts) / 1000));
      const st = calc();
      const gv = st.vps * away, gl = st.lps * away;
      if (away > 60 && (gv > 1 || gl > 0.1)){
        S.void += gv; S.total += gv; S.light += gl;
        setTimeout(() => toast('ПОКА ТЕБЯ НЕ БЫЛО: +' + fmt(gv) + ' void, +' + fmt(gl) + ' light (' + fmtTime(away) + ')'), 800);
      }
    }
  } catch(e){}
}

/* ---------------- цикл ---------------- */
let lastT = performance.now(), nextRefresh = 0, autoTimer = 0;
function frame(now){
  const dt = Math.min(.1, (now - lastT) / 1000);
  lastT = now;

  S.void += stats.vps * dt;
  S.total += stats.vps * dt;
  S.light += stats.lps * dt;

  ambientTick(dt);
  autoBuyTick(dt);

  if (now - lastHud > 90){ lastHud = now; updateHUD(); }
  if (now - lastPop > 800){
    lastPop = now;
    popFlip = !popFlip;
    const el = popFlip ? elVoid : elLight;
    el.classList.add('pop');
    setTimeout(() => el.classList.remove('pop'), 120);
  }
  if (now >= nextRefresh){
    nextRefresh = now + 260; updateNodes();
    const ready = BYID.bb.unlocked();
    elBang.classList.toggle('on', ready);
    if (autoReset && ready){
      autoTimer += dt;
      if (autoTimer > 2.5){ autoTimer = 0; doCollapse(); }
    } else autoTimer = 0;
  }
  saveAcc += dt;
  if (saveAcc > 5){ saveAcc = 0; save(); }

  requestAnimationFrame(frame);
}

/* ---------------- старт ---------------- */
load();
stats = calc();
updateNodes();
updateHUD();
elAuto.classList.toggle('on', autoReset);
applyCam();
requestAnimationFrame(frame);
window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
</script>
